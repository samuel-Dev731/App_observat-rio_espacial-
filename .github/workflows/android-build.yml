name: Android build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    # Runner fixo para builds reproduzíveis.
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.8.2
        uses: gradle/actions/setup-gradle@v6.4.1
        with:
          gradle-version: '9.8.2'

      - name: Repair and install Android NDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          rm -rf "$SDK_ROOT/ndk/28.2.13676358"
          for attempt in 1 2 3; do
            yes | "$SDKMANAGER" --install "ndk;28.2.13676358" && break
            rm -rf "$SDK_ROOT/ndk/28.2.13676358"
            if [ "$attempt" -eq 3 ]; then
              echo "NDK installation failed after 3 attempts"
              exit 1
            fi
            sleep 10
          done
          test -f "$SDK_ROOT/ndk/28.2.13676358/source.properties"
          grep -q 'Pkg.Revision = 28.2.13676358' "$SDK_ROOT/ndk/28.2.13676358/source.properties"

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v7.0.2
        with:
          name: observatorio-espacial-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
