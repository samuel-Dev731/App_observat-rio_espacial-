name: Android build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    # Runner fixo para builds reproduzíveis.
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.8.2
        uses: gradle/actions/setup-gradle@v6.4.1
        with:
          gradle-version: '9.8.2'

      - name: Install and verify Android NDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -x "$SDKMANAGER"
          rm -rf "$SDK_ROOT/ndk/28.2.13676358"
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "ndk;28.2.13676358"
          NDK_DIR="$SDK_ROOT/ndk/28.2.13676358"
          test -s "$NDK_DIR/source.properties"
          grep -Fq "Pkg.Revision = 28.2.13676358" "$NDK_DIR/source.properties"
          test -x "$NDK_DIR/ndk-build"
          echo "NDK 28.2.13676358 instalado e verificado."

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v7.0.2
        with:
          name: observatorio-espacial-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
